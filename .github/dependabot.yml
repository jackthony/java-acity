version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:30"
      timezone: America/Lima
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
